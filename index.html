<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康数据查询系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        body {
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .page {
            display: none;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .page:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .title {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 24px;
            font-weight: 600;
            position: relative;
            padding-bottom: 10px;
        }
        .title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #409eff, #67c23a);
            border-radius: 3px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 40px;
        }
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(64, 158, 255, 0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #409eff, #3385e5);
            color: white;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #3385e5, #256bc9);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #909399, #7a7e84);
            color: white;
            box-shadow: 0 2px 8px rgba(144, 147, 153, 0.2);
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #7a7e84, #66696e);
        }
        .btn-disable {
            background: #ccc !important;
            color: #666 !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-back {
            background: linear-gradient(135deg, #909399, #7a7e84);
            color: white;
            margin-top: 20px;
            width: 100%;
            padding: 12px;
        }
        .form-item {
            margin-bottom: 22px;
        }
        .form-item label {
            display: block;
            margin-bottom: 10px;
            color: #34495e;
            font-weight: 500;
            font-size: 15px;
        }
        .form-item input, .form-item select, .form-item textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafbfc;
        }
        .form-item input:focus, .form-item select:focus, .form-item textarea:focus {
            outline: none;
            border-color: #409eff;
            background: white;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
        }
        .form-item textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }
        .feature-check {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 12px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #555;
        }
        .feature-item input {
            width: auto;
        }
        .chart-box {
            margin: 25px 0;
            height: 400px;
            background: #fafbfc;
            border-radius: 12px;
            padding: 15px;
        }
        .advice-box {
            padding: 18px;
            background: linear-gradient(135deg, #fdf6ec, #fef0e0);
            border-radius: 10px;
            color: #e6a23c;
            margin: 20px 0;
            line-height: 1.7;
            font-size: 14px;
            border-left: 4px solid #e6a23c;
        }
        .advice-box.hide {
            display: none;
        }
        .tip {
            color: #f56c6c;
            margin-top: 12px;
            display: none;
            font-size: 14px;
            padding: 8px 12px;
            background: rgba(245, 108, 108, 0.1);
            border-radius: 6px;
        }
        .tip.show {
            display: block;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 加载动画美化 */
        #loading {
            text-align: center;
            font-size: 16px;
            color: #409eff;
            margin: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .loading-icon {
            width: 20px;
            height: 20px;
            border: 2px solid #409eff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: rotate 1s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ========== 五星评分样式 ========== */
        .rating-group {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 10px 0 20px;
            flex-wrap: wrap;
        }
        .rating-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .stars {
            display: flex;
            gap: 5px;
            cursor: pointer;
        }
        .star {
            font-size: 22px;
            color: #ddd;
            transition: color 0.2s ease;
        }
        .star.active {
            color: #ffd700;
        }

        /* ========== 手机端适配 ========== */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .page { padding: 20px; }
            .title { font-size: 22px; }
            .chart-box { height: 350px; }
            .btn { padding: 12px 24px; }
            .rating-group { gap: 15px; }
        }
        @media (max-width: 480px) {
            .chart-box { height: 300px; }
            .btn-group { flex-direction: column; align-items: center; }
            .btn { width: 100%; }
            .rating-group { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="loading-icon"></div>
            正在加载数据集，请稍候...
        </div>

        <!-- 首页 -->
        <div id="homePage" class="page">
            <h1 class="title">健康数据查询系统</h1>
            <div class="btn-group">
                <button class="btn btn-disable" disabled>录入数据（暂未开放）</button>
                <button class="btn btn-primary" onclick="showPage('checkPage')">察看数据</button>
                <button class="btn btn-secondary" onclick="showPage('feedbackPage')">用户反馈</button>
            </div>
        </div>

        <!-- 数据查询页面 -->
        <div id="checkPage" class="page">
            <h1 class="title">健康数据查询</h1>
            <div class="form-item">
                <label>学号（ID）</label>
                <input type="text" id="userId" placeholder="请输入学号">
            </div>
            <div class="form-item">
                <label>昵称</label>
                <input type="text" id="userName" placeholder="请输入昵称">
            </div>
            <div class="form-item">
                <label>选择图表类型</label>
                <select id="chartType">
                    <option value="line">折线图（按时间查看特征趋势）</option>
                    <option value="bar">柱状图（最新数据归一化展示）</option>
                </select>
            </div>
            <div id="featureSelect" class="form-item">
                <label>选择要查看的特征数据</label>
                <div class="feature-check">
                    <div class="feature-item"><input type="checkbox" value="weight" checked>体重(kg)</div>
                    <div class="feature-item"><input type="checkbox" value="bmi">BMI</div>
                    <div class="feature-item"><input type="checkbox" value="fat">体脂率</div>
                    <div class="feature-item"><input type="checkbox" value="bloodSugar">血糖</div>
                    <div class="feature-item"><input type="checkbox" value="heartRate">心率</div>
                    <div class="feature-item"><input type="checkbox" value="pressure">压力指数</div>
                    <div class="feature-item"><input type="checkbox" value="highPressure">血压(高压)</div>
                    <div class="feature-item"><input type="checkbox" value="lowPressure">血压(低压)</div>
                </div>
            </div>
            <div class="tip" id="errorTip">未匹配到对应学号+昵称，请重新输入！</div>
            <button class="btn btn-primary" onclick="submitQuery()">确认查询</button>
            <button class="btn btn-back" onclick="showPage('homePage')">返回首页</button>
        </div>

        <!-- 图表展示页面 -->
        <div id="chartPage" class="page">
            <h1 class="title">健康数据图表</h1>
            <div class="chart-box">
                <canvas id="healthChart"></canvas>
            </div>
            <div class="advice-box hide" id="adviceBox"></div>
            <button class="btn btn-back" onclick="returnCheck()">返回查询界面</button>
        </div>

        <!-- 新增：用户反馈页面 -->
        <div id="feedbackPage" class="page">
            <h1 class="title">用户反馈</h1>
            <div class="form-item">
                <label>体验评分（色/香/味）</label>
                <div class="rating-group">
                    <div class="rating-item">
                        <span>色</span>
                        <div class="stars" id="colorRating">
                            <span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
                        </div>
                    </div>
                    <div class="rating-item">
                        <span>香</span>
                        <div class="stars" id="smellRating">
                            <span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
                        </div>
                    </div>
                    <div class="rating-item">
                        <span>味</span>
                        <div class="stars" id="tasteRating">
                            <span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-item">
                <label>留言反馈</label>
                <textarea id="feedbackMsg" placeholder="请留下你的宝贵意见~"></textarea>
            </div>
            <div class="tip" id="feedbackTip" style="display: none; color: #67c23a; background: rgba(103, 194, 58, 0.1);">反馈提交成功！感谢你的支持~</div>
            <button class="btn btn-primary" onclick="submitFeedback()">提交反馈</button>
            <button class="btn btn-back" onclick="showPage('homePage')">返回首页</button>
        </div>
    </div>

    <script>
        // 全局数据存储
        let healthData = [];
        let myChart = null;
        // 评分存储
        let ratings = { color: 0, smell: 0, taste: 0 };

        // 页面切换
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('errorTip').classList.remove('show');
            document.getElementById('feedbackTip').style.display = 'none';
        }

        // 五星评分绑定事件
        function initRating() {
            const ratingTypes = ['color', 'smell', 'taste'];
            ratingTypes.forEach(type => {
                const stars = document.querySelectorAll(`#${type}Rating .star`);
                stars.forEach((star, index) => {
                    star.addEventListener('click', () => {
                        ratings[type] = index + 1;
                        stars.forEach((s, i) => s.classList.toggle('active', i <= index));
                    });
                });
            });
        }

        // 提交反馈（纯前端）
        function submitFeedback() {
            const tip = document.getElementById('feedbackTip');
            tip.style.display = 'block';
            // 控制台打印反馈数据（可自行扩展）
            console.log('用户反馈：', ratings, document.getElementById('feedbackMsg').value);
            // 清空输入
            setTimeout(() => {
                document.getElementById('feedbackMsg').value = '';
                document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                ratings = { color: 0, smell: 0, taste: 0 };
            }, 2000);
        }

        // 数据格式化解析函数
        function parseData(rawText) {
            healthData = [];
            const rows = rawText.split('\n');
            const headers = rows[0].split('\t');
            for(let i=1; i<rows.length; i++) {
                if(!rows[i].trim()) continue;
                const cols = rows[i].split('\t');
                const item = {};
                headers.forEach((header, index) => {
                    item[header] = cols[index] || '';
                });
                // 数值格式化
                item.id = item['学号'];
                item.name = item['昵称'];
                item.date = new Date(item['检查日期']);
                item.weight = parseFloat(item['体重(kg)']);
                item.bmi = parseFloat(item['BMI']);
                item.fat = parseFloat(item['体脂率']);
                item.highPressure = parseInt(item['血压(高压)']);
                item.lowPressure = parseInt(item['血压(低压)']);
                item.bloodSugar = parseFloat(item['血糖']);
                item.heartRate = parseInt(item['心率']);
                item.pressure = parseInt(item['压力指数']);
                item.gender = item['性别'];
                healthData.push(item);
            }
        }

        // 异步读取外部数据集文件
        async function loadExternalData() {
            try {
                const response = await fetch('./data/data_1500.txt');
                if (!response.ok) throw new Error('数据集文件不存在！');
                const rawText = await response.text();
                parseData(rawText);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('homePage').classList.add('active');
                initRating(); // 初始化评分组件
            } catch (error) {
                document.getElementById('loading').innerHTML = `加载失败：${error.message}，请检查文件夹结构！`;
                document.getElementById('loading').style.color = '#f56c6c';
            }
        }

        // 提交查询
        function submitQuery() {
            const userId = document.getElementById('userId').value.trim();
            const userName = document.getElementById('userName').value.trim();
            const chartType = document.getElementById('chartType').value;
            
            if(!userId || !userName) {
                document.getElementById('errorTip').innerText = '学号和昵称不能为空！';
                document.getElementById('errorTip').classList.add('show');
                return;
            }

            const userData = healthData.filter(item => item.id === userId && item.name === userName);
            if(userData.length === 0) {
                document.getElementById('errorTip').innerText = '未匹配到对应学号+昵称，请重新输入！';
                document.getElementById('errorTip').classList.add('show');
                return;
            }

            showPage('chartPage');
            chartType === 'line' ? drawLineChart(userData) : drawBarChart(userData);
        }

        // 绘制折线图
        function drawLineChart(userData) {
            userData.sort((a,b) => a.date - b.date);
            const labels = userData.map(item => item.date.toLocaleString());
            const featureMap = {
                weight: {name: '体重(kg)', data: []}, bmi: {name: 'BMI', data: []}, fat: {name: '体脂率', data: []},
                bloodSugar: {name: '血糖', data: []}, heartRate: {name: '心率', data: []}, pressure: {name: '压力指数', data: []},
                highPressure: {name: '血压(高压)', data: []}, lowPressure: {name: '血压(低压)', data: []}
            };

            const checkboxes = document.querySelectorAll('#featureSelect input:checked');
            const selectedFeatures = Array.from(checkboxes).map(cb => cb.value);

            selectedFeatures.forEach(f => {
                userData.forEach(item => { featureMap[f].data.push(item[f]); });
            });

            if(myChart) myChart.destroy();
            const ctx = document.getElementById('healthChart').getContext('2d');
            const colors = ['#409eff', '#67c23a', '#e6a23c', '#f56c6c', '#909399', '#8e44ad', '#1abc9c', '#34495e'];
            const datasets = selectedFeatures.map((f, index) => ({
                label: featureMap[f].name,
                data: featureMap[f].data,
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length] + '33',
                fill: false, tension: 0.3
            }));

            myChart = new Chart(ctx, {
                type: 'line', data: {labels, datasets},
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { text: '健康数据趋势折线图', display: true, font: { size: 16 } } } }
            });
            document.getElementById('adviceBox').classList.add('hide');
        }

        // 绘制柱状图
        function drawBarChart(userData) {
            userData.sort((a,b) => b.date - a.date);
            const latest = userData[0];
            const featureKeys = ['weight', 'bmi', 'fat', 'bloodSugar', 'heartRate', 'pressure', 'highPressure', 'lowPressure'];
            const featureNames = ['体重(kg)', 'BMI', '体脂率', '血糖', '心率', '压力指数', '血压(高压)', '血压(低压)'];
            const maxValues = [100, 40, 0.5, 15, 150, 200, 200, 120];
            const normData = featureKeys.map((key, index) => latest[key] / maxValues[index]);

            const barColors = featureKeys.map((key) => {
                let isAbnormal = false;
                switch(key) {
                    case 'bmi': isAbnormal = latest.bmi < 18.5 || latest.bmi > 23.9; break;
                    case 'fat': 
                        if(latest.gender === '女') isAbnormal = latest.fat < 0.2 || latest.fat > 0.3;
                        else isAbnormal = latest.fat < 0.1 || latest.fat > 0.2; break;
                    case 'bloodSugar': isAbnormal = latest.bloodSugar < 3.9 || latest.bloodSugar > 6.1; break;
                    case 'heartRate': isAbnormal = latest.heartRate < 60 || latest.heartRate > 100; break;
                    case 'pressure': isAbnormal = latest.pressure > 70; break;
                    case 'highPressure': isAbnormal = latest.highPressure < 90 || latest.highPressure > 139; break;
                    case 'lowPressure': isAbnormal = latest.lowPressure < 60 || latest.lowPressure > 89; break;
                    case 'weight': isAbnormal = false; break;
                }
                return isAbnormal ? '#f56c6c' : '#409eff';
            });

            if(myChart) myChart.destroy();
            const ctx = document.getElementById('healthChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: featureNames,
                    datasets: [{
                        label: '健康特征归一化值',
                        data: normData,
                        backgroundColor: barColors
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { text: '最新健康数据柱状图', display: true, font: { size: 16 } } } }
            });
            generateAdvice(latest);
        }

        // 生成健康建议
        function generateAdvice(data) {
            const advice = [];
            if(data.bmi < 18.5) advice.push('BMI偏低，体型偏瘦，建议增加营养摄入、规律饮食');
            if(data.bmi > 23.9) advice.push('BMI偏高，体型超重，建议控制饮食、增加运动');
            
            if(data.gender === '女') {
                if(data.fat < 0.2) advice.push('体脂率偏低，女性需维持正常体脂，注意营养');
                if(data.fat > 0.3) advice.push('体脂率偏高，建议减少高脂食物、增加有氧训练');
            } else {
                if(data.fat < 0.1) advice.push('体脂率偏低，男性需补充蛋白质、规律锻炼');
                if(data.fat > 0.2) advice.push('体脂率偏高，建议减脂塑形、控制热量摄入');
            }
            
            if(data.bloodSugar < 3.9) advice.push('血糖偏低，建议及时补充糖分、规律三餐');
            if(data.bloodSugar > 6.1) advice.push('血糖偏高，建议低糖饮食、定期监测血糖');
            if(data.heartRate < 60) advice.push('心率过缓，若无运动习惯建议检查心脏功能');
            if(data.heartRate > 100) advice.push('心率过速，建议避免熬夜、减少情绪激动');
            if(data.pressure > 70) advice.push('压力指数偏高，建议放松心情、保证睡眠、适当减压');
            if(data.highPressure < 90) advice.push('收缩压（高压）偏低，建议增加营养、避免突然站立');
            if(data.highPressure > 139) advice.push('收缩压（高压）偏高，建议低盐饮食、监测血压');
            if(data.lowPressure < 60) advice.push('舒张压（低压）偏低，注意休息、补充水分');
            if(data.lowPressure > 89) advice.push('舒张压（低压）偏高，建议控制体重、规律作息');

            const adviceBox = document.getElementById('adviceBox');
            advice.length ? (adviceBox.innerText = '健康建议：' + advice.join('；'), adviceBox.classList.remove('hide')) : adviceBox.classList.add('hide');
        }

        // 返回查询页
        function returnCheck() {
            showPage('checkPage');
            if(myChart) myChart.destroy();
        }

        // 图表类型切换
        document.getElementById('chartType').addEventListener('change', function() {
            document.getElementById('featureSelect').style.display = this.value === 'line' ? 'block' : 'none';
        });

        // 页面加载
        window.onload = loadExternalData;
    </script>
</body>
</html>
